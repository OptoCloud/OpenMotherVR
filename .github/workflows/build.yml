# Reusable build: d3d11.dll as a 32-bit release build with warnings as
# errors, checked and packaged. Called by ci.yml and release.yml.
name: build

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the DLL and the package name (1.0.0, 1.0.0-rc.2)
        type: string
        required: true
    outputs:
      package:
        description: Name of the uploaded package artifact
        value: ${{ jobs.build.outputs.package }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      package: ${{ steps.package.outputs.name }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      # The one binary the DLL embeds is Valve's OpenVR loader 1.0.10; take
      # it from Valve's repository rather than this repo's LFS store.
      - name: Fetch the OpenVR loader
        shell: pwsh
        run: ./scripts/fetch_openvr_api.ps1

      - name: Read the vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $b = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          "commit=$b" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-cache
          key: vcpkg-${{ steps.baseline.outputs.commit }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: vcpkg-${{ steps.baseline.outputs.commit }}-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone --quiet https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout --quiet ${{ steps.baseline.outputs.commit }}
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      # Whatever Visual Studio the runner image has, as a 32-bit toolset;
      # Ninja keeps the build independent of the VS generator version.
      - name: Set up the MSVC x86 environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars32.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }

      - name: Configure
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DMOTHERVR_WERROR=ON "-DMOTHERVR_VERSION=$env:VERSION"

      - name: Build
        run: cmake --build build

      - name: Check the DLL
        shell: pwsh
        run: ./scripts/check_dll.ps1 build/d3d11.dll

      - name: Package
        id: package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/package.ps1 -Dll build/d3d11.dll -Version $env:VERSION -OutDir out

      # The folder, not the zip: the artifact download is zipped already.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/${{ steps.package.outputs.name }}/
          if-no-files-found: error
