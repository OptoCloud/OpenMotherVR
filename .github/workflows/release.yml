# Pushing a tag vMAJOR.MINOR.PATCH[-pre] publishes a GitHub release:
# the tag must be on master and have release-notes/<tag>.md, the DLL is
# built and stamped with the version, and the zip, its SHA-256 sums and a
# build provenance attestation are attached. Tags with a hyphen
# (v1.0.0-rc.2) become prereleases. See BUILDING.md, "Making a release".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check the tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-pre]"; exit 1
          fi
          version=${BASH_REMATCH[1]}
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG points at a commit that is not on master"; exit 1
          fi
          if [[ ! -s "release-notes/$TAG.md" ]]; then
            echo "::error::release-notes/$TAG.md is missing or empty"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.preflight.outputs.version }}

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.package }}
          path: out/${{ needs.build.outputs.package }}

      - name: Zip and hash
        env:
          NAME: ${{ needs.build.outputs.package }}
        run: |
          cd out
          (cd "$NAME" && zip -q -X -r "../$NAME.zip" .)
          sha256sum "$NAME.zip" > SHA256SUMS.txt
          (cd "$NAME" && sha256sum d3d11.dll) >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/${{ needs.build.outputs.package }}.zip
            out/${{ needs.build.outputs.package }}/d3d11.dll

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.build.outputs.package }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          assets=("out/$NAME.zip" out/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: refresh the notes and assets of the existing release.
            gh release edit "$TAG" --notes-file "release-notes/$TAG.md" --prerelease="$PRERELEASE"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag \
              --title "OpenMotherVR ${TAG#v}" --notes-file "release-notes/$TAG.md" \
              --prerelease="$PRERELEASE"
          fi
